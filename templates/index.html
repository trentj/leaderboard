<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaderboard</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        main {
            max-width: 48rem;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }
        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2.5rem, 6vw, 4rem);
        }
        p {
            margin: 0 0 1.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        a {
            display: inline-block;
            padding: 0.85rem 1.1rem;
            border-radius: 0.75rem;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        a.secondary {
            background: #1e293b;
        }
    </style>
</head>
<body>
<main>
    <h1>Leaderboard</h1>
    <p>Upload a new `.ods` file to replace the results database, or jump into the kiosk slideshow.</p>
    <nav>
        <a href="/upload">Upload spreadsheet</a>
        <a href="/kiosk" class="secondary">Open kiosk slideshow</a>
    </nav>
</main>
</body>
</html>
